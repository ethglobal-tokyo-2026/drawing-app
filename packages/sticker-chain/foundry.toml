[profile.default]
src = "contracts"
test = "test/foundry"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
# ENSv2 pins 0.8.25 and needs Cancun opcodes; Sepolia has both.
solc_version = "0.8.25"
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
  "ens-v2/=lib/ens-contracts-v2/contracts/src/",
  "ens-v2-lib/=lib/ens-contracts-v2/contracts/lib/",
  # ENSv2's own sources resolve their imports the way its repository does.
  "lib/ens-contracts-v2/contracts/:@openzeppelin/contracts/=lib/ens-contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
  "lib/ens-contracts-v2/contracts/:@openzeppelin/contracts-upgradeable/=lib/ens-contracts-v2/contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
  "lib/ens-contracts-v2/contracts/:@ens/contracts/=lib/ens-contracts-v2/contracts/lib/ens-contracts/contracts/",
  "lib/ens-contracts-v2/contracts/:@ensdomains/verifiable-factory/=lib/ens-contracts-v2/contracts/lib/verifiable-factory/src/",
  "lib/ens-contracts-v2/contracts/:~src/=lib/ens-contracts-v2/contracts/src/",
]
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
