[profile.default]
src = "contracts"
test = "test/foundry"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
