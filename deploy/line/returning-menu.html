<!doctype html>
<!--
  The returning-user rich menu: Draw, My board and Explore under the official account's chat. returning-menu.png and
  returning-menu.ja.png are this page's screenshots, and create-returning-menu.sh uploads one to LINE per language.
  Re-render: open this page at a 2500 × 843 viewport with device scale 1, wait for document.fonts.ready, then
  screenshot the viewport: as it is for returning-menu.png, and with ?lang=ja for returning-menu.ja.png.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Returning-user rich menu</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&family=Zen+Kaku+Gothic+New:wght@700&display=swap"
    />
    <style>
      :root {
        --liner: #f2f1f6;
        --ink: #1c1824;
        --seal: #ffd93b;
        --pink: #ff4f9a;
        --aqua: #38d3dc;
      }

      html,
      body {
        margin: 0;
        width: 2500px;
        height: 843px;
        overflow: hidden;
        background: var(--liner);
      }

      /* Sized in the design's phone pixels (a 390 px wide row), then zoomed to LINE's 2500 px wide image. */
      .menu {
        zoom: calc(2500 / 390);
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /* The design's row is 138 tall; LINE's 843 is shorter, so the tiles keep their size and the top and bottom
           padding give. */
        grid-template-rows: 122px;
        align-content: center;
        gap: 7px;
        width: 390px;
        height: calc(843px * 390 / 2500);
        padding: 0 8px;
        box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.06);
        font-family: "Mona Sans", "Zen Kaku Gothic New", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.35;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      .tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 8px;
        box-shadow: inset 0 0 0 1px rgba(28, 24, 36, 0.16);
      }
      .tile--draw {
        background: var(--seal);
      }
      .tile--board {
        background: var(--pink);
      }
      .tile--explore {
        background: var(--aqua);
      }

      .tile svg {
        display: block;
        flex: none;
        width: 30px;
        height: 30px;
        fill: currentColor;
      }
      .tile b {
        font-weight: 800;
        font-stretch: 112%;
        font-size: 19px;
        letter-spacing: -0.01em;
      }

      /* One image serves everyone, so the dot states the ticket rule rather than a count of what's left. */
      .dot {
        position: absolute;
        right: 10px;
        top: 9px;
        padding: 3px 6px 2px;
        border-radius: 10px;
        background: #fff;
        font-stretch: 75%;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transform: rotate(-4deg);
        box-shadow: 0 1px 2px rgba(28, 24, 36, 0.2);
      }
    </style>
  </head>
  <body>

         @material-symbols/svg-700 0.47.5), and Phosphor Icons "smiley-sticker" and "eyes" (MIT, @phosphor-icons/core 2.1.1). -->

        <span class="dot" data-ja="1日3枚">3 a day</span>
      </div>

            d="M176,32c-20.61,0-38.28,18.16-48,45.85C118.28,50.16,100.61,32,80,32c-31.4,0-56,42.17-56,96s24.6,96,56,96c20.61,0,38.28-18.16,48-45.85,9.72,27.69,27.39,45.85,48,45.85,31.4,0,56-42.17,56-96S207.4,32,176,32ZM106.92,186.39C99.43,200.12,89.62,208,80,208s-19.43-7.88-26.92-21.61a104.81,104.81,0,0,1-10.24-29.23,32,32,0,1,0,0-58.32A104.81,104.81,0,0,1,53.08,69.61C60.57,55.88,70.38,48,80,48s19.43,7.88,26.92,21.61C115.35,85.07,120,105.81,120,128S115.35,170.93,106.92,186.39Zm96,0C195.43,200.12,185.62,208,176,208s-19.43-7.88-26.92-21.61a104.81,104.81,0,0,1-10.24-29.23,32,32,0,1,0,0-58.32,104.81,104.81,0,0,1,10.24-29.23C156.57,55.88,166.38,48,176,48s19.43,7.88,26.92,21.61C211.35,85.07,216,105.81,216,128S211.35,170.93,202.92,186.39Z"
          />
        </svg>
        <b data-ja="さがす">Explore</b>
      </div>
    </div>
    <script>
      // ?lang=ja draws the Japanese menu, returning-menu.ja.png.
      if (new URLSearchParams(location.search).get("lang") === "ja") {
        document.documentElement.lang = "ja";
        for (const label of document.querySelectorAll("[data-ja]"))
          label.textContent = label.dataset.ja;
      }
    </script>
  </body>
</html>
