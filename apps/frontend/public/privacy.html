<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Policy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap"
    />
    <style>
      body {
        margin: 0;
        padding: 24px 20px 40px;
        background: #f2f1f6;
        color: #1c1824;
        font:
          400 15px/1.5 "Mona Sans",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 38em;
        margin: 0 auto;
      }
      .placeholder {
        display: inline-block;
        margin: 0 0 20px;
        padding: 6px 10px;
        border-radius: 6px;
        background: #ffd93b;
        font-weight: 700;
        transform: rotate(-1.5deg);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        font-weight: 800;
        font-stretch: 112%;
        line-height: 1.1;
      }
      a {
        color: inherit;
      }
      .boat {
        margin: 20px 0 0;
      }
      .boat img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
      }
      .boat figcaption {
        margin-top: 12px;
        font-size: 22px;
        font-weight: 800;
        font-stretch: 112%;
      }
      .back {
        display: inline-block;
        margin-top: 24px;
        color: #6e6878;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="placeholder">Placeholder: the real Privacy Policy isn&rsquo;t written yet</p>
      <h1>Privacy Policy</h1>
      <figure class="boat">
        <img
          src="/nice-boat.jpg"
          width="1024"
          height="576"
          alt="A ferry crossing a still Norwegian fjord, under a notice that the scheduled program has been changed"
        />
        <figcaption>Nice boat.</figcaption>
      </figure>
      <a class="back" href="/">Back to the app</a>
    </main>
  </body>
</html>
