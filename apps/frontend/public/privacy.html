<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Policy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap"
    />
    <style>
      body {
        margin: 0;
        padding: 24px 20px 40px;
        background: #f2f1f6;
        color: #1c1824;
        font:
          400 15px/1.5 "Mona Sans",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 38em;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        font-weight: 800;
        font-stretch: 112%;
        line-height: 1.1;
      }
      a {
        color: inherit;
      }
      #broadcast {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 20px;
        border-radius: 10px;
        background: #1c1824;
      }
      .back {
        display: inline-block;
        margin-top: 24px;
        color: #6e6878;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Privacy Policy</h1>
      <video
        id="broadcast"
        src="/nice-boat.mp4"
        poster="/nice-boat.jpg"
        width="960"
        height="540"
        loop
        playsinline
        controls
        preload="auto"
        aria-label="A ferry crossing a still Norwegian fjord to Air on the G String, under a notice that the scheduled program has been changed"
      ></video>
      <a class="back" href="/">Back to the app</a>
    </main>
    <script>
      // With sound where the browser allows it, muted where it doesn't; the first tap anywhere but
      // the video, whose own controls handle their taps, brings the sound back.
      const broadcast = document.getElementById("broadcast");
      const report = (error) => console.error("The broadcast didn't play", error);
      broadcast.play().catch((error) => {
        if (error.name !== "NotAllowedError") return report(error);
        broadcast.muted = true;
        broadcast.play().catch(report);
      });
      const unmute = (event) => {
        if (event.target === broadcast) return;
        broadcast.muted = false;
        removeEventListener("click", unmute);
      };
      addEventListener("click", unmute);
    </script>
  </body>
</html>
