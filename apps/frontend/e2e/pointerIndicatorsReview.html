<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      html,
      body {
        position: static !important;
        overflow: auto !important;
        height: auto !important;
      }
      #root {
        height: auto !important;
        overflow: visible !important;
      }
      .pointer-review {
        max-width: 900px;
        margin: auto;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      }
      .pointer-review h1 {
        margin: 0 0 12px;
        font-size: clamp(26px, 5vw, 40px);
      }
      .pointer-review__intro,
      .pointer-review__explanation {
        color: var(--graphite-on-deep);
        max-width: 66ch;
      }
      .pointer-review__controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: 24px 0;
      }
      .pointer-review__switch {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 44px;
      }
      .pointer-review__language {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .pointer-review select {
        min-height: 44px;
        border: 1px solid var(--rule-strong);
        border-radius: var(--r-label);
        background: var(--canvas);
        color: var(--ink);
        padding: 8px 12px;
        font: inherit;
      }
      .pointer-review__status {
        display: inline-block;
        padding: 10px 14px;
        border-radius: var(--r-label);
        background: var(--seal-soft);
        font-size: 20px;
        font-weight: 800;
      }
      .pointer-review__status[data-detected] {
        background: var(--aqua-soft);
      }
      .pointer-review__target {
        min-height: clamp(250px, 40vh, 380px);
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        padding: 30px;
        margin: 24px 0;
        border: 2px dashed var(--graphite);
        border-radius: 18px;
        background: var(--canvas);
        touch-action: none;
      }
      .pointer-review__target h2 {
        margin: 0 0 10px;
      }
      .pointer-review__target p {
        max-width: 42ch;
        color: var(--graphite);
      }
      .pointer-review__counts {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
        margin: 20px 0;
        font-variant-numeric: tabular-nums;
      }
      .pointer-review__event {
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
        padding: 14px;
        border-radius: var(--r-label);
        background: var(--liner-deep);
      }
      .pointer-review__problem {
        margin: 14px 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./pointerIndicatorsReview.tsx"></script>
  </body>
</html>
