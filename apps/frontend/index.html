<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Dela Gothic One, fetched early and applied when it arrives, so it never blocks the first paint.
         Croquis Sans comes with the app's styles (src/styles/fonts.css), and the Japanese face only once
         the app is in Japanese (src/i18n/japaneseFont.ts). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
      />
    </noscript>
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F2F1F6" />
    <title>Croquis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
