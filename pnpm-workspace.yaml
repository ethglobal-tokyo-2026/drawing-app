packages:
  - apps/*
  - packages/*
# Minutes. Gives the registry time to pull a compromised release before it is installed.
minimumReleaseAge: 4320
allowBuilds:
  better-sqlite3: true
  # esbuild's postinstall only optimizes its CLI; drizzle-kit uses the JS API, which works without it.
  esbuild: false
  bufferutil: false
  utf-8-validate: false
  # Privy's SDK brings these in. AppKit's postinstall only compares AppKit versions; keccak's builds an
  # optional native addon, and the browser uses its JavaScript version either way.
  "@reown/appkit": false
  keccak: false
minimumReleaseAgeExclude:
  - viem@2.56.9
# drizzle-kit/api's types import zod, which drizzle-kit doesn't declare, so they'd resolve to `any`.
packageExtensions:
  drizzle-kit:
    dependencies:
      zod: 3.25.76
